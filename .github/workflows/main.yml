name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: "github-pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: dx build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          cache: true

      - name: Install dx
        run: curl -sSL https://dioxus.dev/install.sh | bash

      - name: Check format
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --target wasm32-unknown-unknown --all-features -- -D warnings

      - name: cargo test
        # Tests run on the host target; the web app is built for wasm32 only by dx.
        run: cargo test

      - name: dx build
        run: dx build --release && ls -laR target/dx/beercalc/release/web/public

      - name: Prepare GitHub Pages SPA fallback
        run: |
          cp target/dx/beercalc/release/web/public/index.html target/dx/beercalc/release/web/public/404.html
          touch target/dx/beercalc/release/web/public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "target/dx/beercalc/release/web/public"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
